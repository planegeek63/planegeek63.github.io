<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey There</title>
<meta name="description" content="Connect with James: email, LinkedIn, and YouTube.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #17123a;
    --ink: #f4f1ff;
    --muted: #b4aedb;
    --accent: #6d4aff;
    --orb1: #4a3aa8;
    --orb2: #a34a5c;
    --orb3: #1f7a73;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    padding: 2rem 1.25rem;
  }

  /* Drifting background shapes */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .7;
    z-index: 0;
    will-change: transform;
  }
  .orb.a { width: 38vmax; height: 38vmax; background: var(--orb1); top: -10vmax; left: -8vmax; animation: wander-a 12s ease-in-out infinite; }
  .orb.b { width: 30vmax; height: 30vmax; background: var(--orb2); bottom: -8vmax; right: -6vmax; animation: wander-b 12s ease-in-out infinite; }
  .orb.c { width: 22vmax; height: 22vmax; background: var(--orb3); top: 45%; left: 55%; animation: wander-c 12s ease-in-out infinite; }

  /* Each orb follows its own looping path across the whole screen */
  @keyframes wander-a {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(70vw, 15vh) scale(1.15); }
    50%  { transform: translate(55vw, 75vh) scale(.9); }
    75%  { transform: translate(5vw, 60vh) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes wander-b {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(-60vw, -20vh) scale(1.1); }
    50%  { transform: translate(-75vw, -70vh) scale(.9); }
    75%  { transform: translate(-20vw, -50vh) scale(1.15); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes wander-c {
    0%   { transform: translate(0, 0) scale(1); }
    20%  { transform: translate(-45vw, -30vh) scale(1.2); }
    45%  { transform: translate(-20vw, 35vh) scale(.85); }
    70%  { transform: translate(25vw, -35vh) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
  }

  main { position: relative; z-index: 1; text-align: center; max-width: 48rem; }

  /* The one big moment: name letters rise in one by one */
  h1 {
    font-size: clamp(3rem, 12vw, 7rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  h1 .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.6em) rotate(4deg);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--i) * 60ms + 150ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .tagline {
    margin-top: 1.25rem;
    font-size: clamp(1.05rem, 2.5vw, 1.35rem);
    color: var(--muted);
    opacity: 0;
    animation: fade .8s ease forwards;
    animation-delay: 1s;
  }
  @keyframes fade { to { opacity: 1; } }

  nav {
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .9rem;
    opacity: 0;
    animation: fade .8s ease forwards;
    animation-delay: 1.3s;
  }
  nav a, nav button {
    font-family: inherit;
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: .6rem;
    width: 11rem;
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    padding: .85rem 1.6rem;
    border: 2px solid var(--ink);
    border-radius: 999px;
    transition: transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  nav a svg, nav button svg { width: 1.3rem; height: 1.3rem; flex: none; }
  nav a:hover, nav a:focus-visible, nav button:hover, nav button:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-3px);
  }
  nav a:focus-visible, nav button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Top row: the three links, centered */
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: .9rem; }
  @media (max-width: 36rem) {
    nav a, nav button { width: 9.5rem; padding: .85rem .5rem; }
  }

  /* About me pop-up */
  dialog {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 1.25rem;
    border: none;
    background: transparent;
    color: var(--ink);
    overflow: auto;
  }
  dialog[open] { display: grid; }
  dialog::backdrop { background: rgba(10, 7, 30, .55); backdrop-filter: blur(6px); }
  dialog[open] .card { animation: pop .4s cubic-bezier(.2, .9, .3, 1.2); }
  dialog[open]::backdrop { animation: bd .3s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(1.5rem) scale(.9); } }
  @keyframes bd { from { opacity: 0; } }

  .card {
    position: relative;
    width: min(100%, 30rem);
    margin: auto;
    background: #221b52;
    border: 2px solid rgba(255, 255, 255, .14);
    border-radius: 1.75rem;
    padding: 2.25rem 2rem 2rem;
    text-align: center;
    box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .45);
  }
  .avatar {
    position: relative;
    width: 6.5rem;
    height: 6.5rem;
    margin: 0 auto 1.1rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--orb2));
    display: grid;
    place-items: center;
    font-size: 2.6rem;
    font-weight: 800;
    overflow: hidden;
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card h2 { font-size: 1.7rem; letter-spacing: -0.02em; }
  .card p { margin-top: .8rem; color: var(--muted); line-height: 1.6; }
  .close {
    position: absolute;
    top: .8rem;
    right: .8rem;
    width: 2.4rem;
    height: 2.4rem;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
    color: var(--ink);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    transition: background .2s ease;
  }
  .close:hover, .close:focus-visible { background: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none !important; }
    dialog[open] .card, dialog[open]::backdrop { animation: none; }
    h1 .ch, .tagline, nav { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="orb a" aria-hidden="true"></div>
  <div class="orb b" aria-hidden="true"></div>
  <div class="orb c" aria-hidden="true"></div>

  <main>
    <h1 id="name" aria-label="JM">Hey There</h1>
    <p class="tagline">Connect with me below</p>
    <nav aria-label="Contact and social links">
      <div class="links">
      <a href="mailto:james@jmaviation.co">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Email
      </a>
      <a href="https://www.linkedin.com/in/james-m-35a411200" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
      <a href="https://www.youtube.com/@RoamingwithJames" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTube
      </a>
      </div>
      <button type="button" id="open-about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        About me
      </button>
    </nav>
  </main>

  <dialog id="about" aria-labelledby="about-title">
    <div class="card">
      <button type="button" class="close" aria-label="Close">&times;</button>
      <div class="avatar">J<img src="photo.jpg" alt="Photo of James" onerror="this.remove()"></div>
      <h2 id="about-title">Hi, I'm James</h2>
      <p>I'm a professional pilot, and I share my travels and flying adventures on my YouTube channel.</p>
      <p>Come along for the ride, and feel free to reach out using the links on the page.</p>
    </div>
  </dialog>

  <script>
    // Split the name into letters so each one can animate in.
    var h = document.getElementById("name");
    var text = h.textContent;
    h.textContent = "";
    Array.from(text).forEach(function (c, i) {
      var s = document.createElement("span");
      s.className = "ch";
      s.setAttribute("aria-hidden", "true");
      s.style.setProperty("--i", i);
      s.textContent = c === " " ? "\u00A0" : c;
      h.appendChild(s);
    });

    // About me pop-up: opens from the button, closes with ×, Esc, or a click outside the card.
    var dlg = document.getElementById("about");
    document.getElementById("open-about").addEventListener("click", function () { dlg.showModal(); });
    dlg.querySelector(".close").addEventListener("click", function () { dlg.close(); });
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  </script>
</body>
</html>
