<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey There</title>
<meta name="description" content="Connect with James: email, LinkedIn, and YouTube.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #17123a;
    --ink: #f4f1ff;
    --muted: #b4aedb;
    --accent: #6d4aff;
    --orb1: #4a3aa8;
    --orb2: #a34a5c;
    --orb3: #1f7a73;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    padding: 2rem 1.25rem;
  }

  /* Drifting background shapes */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .7;
    z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.a { width: 38vmax; height: 38vmax; background: var(--orb1); top: -10vmax; left: -8vmax; }
  .orb.b { width: 30vmax; height: 30vmax; background: var(--orb2); bottom: -8vmax; right: -6vmax; animation-duration: 22s; }
  .orb.c { width: 22vmax; height: 22vmax; background: var(--orb3); top: 45%; left: 55%; animation-duration: 26s; }
  @keyframes drift {
    to { transform: translate(6vmax, -4vmax) scale(1.12); }
  }

  main { position: relative; z-index: 1; text-align: center; max-width: 40rem; }

  /* The one big moment: name letters rise in one by one */
  h1 {
    font-size: clamp(3rem, 12vw, 7rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  h1 .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.6em) rotate(4deg);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--i) * 60ms + 150ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .tagline {
    margin-top: 1.25rem;
    font-size: clamp(1.05rem, 2.5vw, 1.35rem);
    color: var(--muted);
    opacity: 0;
    animation: fade .8s ease forwards;
    animation-delay: 1s;
  }
  @keyframes fade { to { opacity: 1; } }

  nav {
    margin-top: 2.5rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .9rem;
    opacity: 0;
    animation: fade .8s ease forwards;
    animation-delay: 1.3s;
  }
  nav a {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    padding: .85rem 1.6rem;
    border: 2px solid var(--ink);
    border-radius: 999px;
    transition: transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  nav a svg { width: 1.3rem; height: 1.3rem; flex: none; }
  nav a:hover, nav a:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-3px);
  }
  nav a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
    h1 .ch, .tagline, nav { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="orb a" aria-hidden="true"></div>
  <div class="orb b" aria-hidden="true"></div>
  <div class="orb c" aria-hidden="true"></div>

  <main>
    <h1 id="name" aria-label="Hey There">Hey There</h1>
    <p class="tagline">Connect with me below</p>
    <nav aria-label="Contact and social links">
      <a href="mailto:james@jmaviation.co">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Email
      </a>
      <a href="https://www.linkedin.com/in/james-m-35a411200" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
      <a href="https://www.youtube.com/@RoamingwithJames" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTube
      </a>
    </nav>
  </main>

  <script>
    // Split the name into letters so each one can animate in.
    var h = document.getElementById("name");
    var text = h.textContent;
    h.textContent = "";
    Array.from(text).forEach(function (c, i) {
      var s = document.createElement("span");
      s.className = "ch";
      s.setAttribute("aria-hidden", "true");
      s.style.setProperty("--i", i);
      s.textContent = c === " " ? "\u00A0" : c;
      h.appendChild(s);
    });
  </script>
</body>
</html>
